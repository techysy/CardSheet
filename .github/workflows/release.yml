name: Release

# 打 v* tag 触发，三段式（对齐 10router CLI 的「出包后自检」约定，做成 CI 三平台矩阵）：
#   pack    → 跑测试 → 校验 tag 与 package.json 版本一致 → npm pack 出 tgz
#   verify  → Ubuntu / Windows / macOS 三平台把 tgz 装进干净环境，跑真实拼版并校验输出
#             （sharp 的平台二进制由 registry 按当前平台自动解析 —— 这一关就是验它）
#   release → 三平台全绿才创建 GitHub Release（附件为 tgz）
# npm 发布在本地手动完成（npm publish --registry=https://registry.npmjs.org），CI 不碰 npm
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # 需要创建 Release

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 打 tag 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "❌ tag $TAG 与 package.json 版本 v$VER 不一致"
            exit 1
          fi
          echo "✅ tag $TAG 与版本一致"

      - name: 打包
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tgz
          path: dist/*.tgz
          if-no-files-found: error

  verify:
    name: 试装验证 (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: tgz
          path: dist

      # 不 checkout、不装 devDependencies —— 干净环境里 tgz 必须自己把依赖拉齐。
      # 先 npm init：空目录直接 `npm install <tarball>` 在部分 npm 版本下不会落盘
      - name: 安装 tgz
        shell: bash
        run: |
          npm init -y >/dev/null
          # 必须带 file: 前缀。光写 dist/xxx.tgz 会被 npm 当成 GitHub 简写
          # （<user>/<repo> 形式）→ ssh://git@github.com/dist/xxx.tgz → git@github.com:
          # Permission denied (publickey)。本机没有 EALLOWGIT 时会直接报错，
          # 上了 CI（预装 git）反而是静默走 git 路线然后死在 publickey 上，更难查。
          # 顺带用 $(ls ...) 替掉裸 glob：glob 匹配不到时会原样传进 npm，报错信息没法看。
          npm install --no-audit --no-fund "file:$(ls dist/*.tgz)"

      - name: bin 入口可执行
        shell: bash
        # --no-install：只允许解析本地装好的 tgz，禁止 npx 从 registry 兜底（否则验证形同虚设）
        run: npx --no-install cardsheet --help

      # 120x80mm @100dpi = 472x315px，与 test/smoke.js 同一组数字
      - name: 真实拼版并校验输出
        shell: bash
        run: |
          node -e "require('sharp')({ create: { width: 400, height: 250, channels: 3, background: '#e0e0e0' } }).png().toFile('card.png')"
          npx --no-install cardsheet card.png --sheet 120x80 --dpi 100 --repeat --cutlines -o out
          node -e "require('sharp')('out/sheet.png').metadata().then((m) => { if (m.width !== 472 || m.height !== 315) throw new Error('输出尺寸不符: ' + m.width + 'x' + m.height); console.log('✓ ' + m.width + 'x' + m.height); })"

      # PDF 是本版新增的输出路径，依赖 pdf-lib。如果它漏在 dependencies 里，
      # 上面的步骤照样全绿（旧路径不碰它），只有 --format pdf 会在运行时炸 ——
      # 所以这里必须真的跑一次，而不是只装上就算过。
      - name: PDF 输出可用（验 pdf-lib 真的打进了包）
        shell: bash
        run: |
          npx --no-install cardsheet card.png --sheet 120x80 --dpi 100 --cell 40x30 --cutlines dashed --format pdf -o out-pdf
          node -e "const b=require('fs').readFileSync('out-pdf/sheet.pdf'); if (b.subarray(0,5).toString()!=='%PDF-') throw new Error('不是 PDF'); console.log('✓ ' + b.length + ' bytes');"

  release:
    needs: [pack, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tgz
          path: dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
