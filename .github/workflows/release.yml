name: Release

# 打 v* tag 触发：跑测试 → 打包 tgz → 建 GitHub Release
# 用法：npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0），留空则用当前 HEAD'
        required: false

permissions:
  contents: write  # 需要创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 打 tag 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "❌ tag $TAG 与 package.json 版本 v$VER 不一致"
            exit 1
          fi
          echo "✅ tag $TAG 与版本一致"

      - name: 打包
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -la dist/

      - name: 发布 npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
