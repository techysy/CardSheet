name: Release

# 打 v* tag 触发：跑测试 → 打包 tgz → 建 GitHub Release
# npm 发布在本地手动完成（npm publish --registry=https://registry.npmjs.org），CI 不碰 npm
# 用法：npm version patch && npm publish && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # 需要创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 打 tag 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "❌ tag $TAG 与 package.json 版本 v$VER 不一致"
            exit 1
          fi
          echo "✅ tag $TAG 与版本一致"

      - name: 打包
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -la dist/

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
