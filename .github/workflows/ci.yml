name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # test/smoke.js requires sharp and the engine, so deps must be installed first
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 生产依赖的安全公告硬门禁（约定同 imgmark）；显式官方源，避免镜像滞后误报
      - name: Check production advisories
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Syntax check
        shell: bash
        run: |
          for f in bin/*.js src/*.js test/*.js scripts/*.mjs; do
            [ -e "$f" ] && node --check "$f"
          done

      - name: Test
        run: npm test
